name: Rollout Scope Guardrail & Load Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guardrail-and-load-verify:
    name: Typecheck, Policy Guardrail & Saturation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run automated guardrail & load saturation test suite
        run: npm test

      - name: Run rollout scope policy check against candidate config
        run: npm run policy:check

      - name: Verify mutated scope-leak config is rejected by guardrail
        run: |
          if npm run policy:check:mutated; then
            echo "ERROR: Guardrail failed to block mutated scope leak!"
            exit 1
          else
            echo "Verified: Guardrail blocked unsafe scope leak as expected."
          fi
